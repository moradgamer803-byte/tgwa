plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zyvo.tgwa'
    compileSdk 34

    defaultConfig {
        applicationId "com.zyvo.tgwa"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
